services:
  emqx:
    build:
      context: .
      dockerfile: docker/emqx/Dockerfile.local
    container_name: emqx-broker
    hostname: emqx
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Bogota}
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USER:-admin}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "${MQTT_TCP_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./docker/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  publisher:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: iot-publisher
    hostname: publisher
    restart: unless-stopped
    command: ["/app/.venv/bin/iot-publisher"]
    environment:
      - TZ=${TZ:-America/Bogota}
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
      - MQTT_TRANSPORT=tcp
      - MQTT_USE_TLS=false
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-iot/sensors}
      - DEVICE_DEVICE_ID=${DEVICE_DEVICE_ID:-sensor-001}
      - DEVICE_PUBLISH_INTERVAL_SECONDS=${DEVICE_PUBLISH_INTERVAL_SECONDS:-2}
      - DEVICE_MIN_TEMPERATURE_CELSIUS=${DEVICE_MIN_TEMPERATURE_CELSIUS:-15}
      - DEVICE_MAX_TEMPERATURE_CELSIUS=${DEVICE_MAX_TEMPERATURE_CELSIUS:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot_network

  consumer:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: iot-consumer
    hostname: consumer
    restart: unless-stopped
    command: ["/app/.venv/bin/iot-consumer"]
    environment:
      - TZ=${TZ:-America/Bogota}
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
      - MQTT_TRANSPORT=tcp
      - MQTT_USE_TLS=false
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-iot/sensors}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot_network

volumes:
  emqx_data:
    name: emqx_data
  emqx_log:
    name: emqx_log

networks:
  iot_network:
    name: iot_network
    driver: bridge
