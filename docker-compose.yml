services:
  emqx:
    build:
      context: .
      dockerfile: docker/emqx/Dockerfile.local
    container_name: emqx-broker
    hostname: emqx
    restart: unless-stopped
    environment:
      - TZ=America/Bogota
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public
    ports:
      - "1883:1883"     # MQTT TCP
      - "8083:8083"     # MQTT WebSocket
      - "18083:18083"   # Dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./docker/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    networks:
      - iot_network

volumes:
  emqx_data:
    name: emqx_data
  emqx_log:
    name: emqx_log

networks:
  iot_network:
    name: iot_network
    driver: bridge