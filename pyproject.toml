[project]
name = "iot-distributed-event-platform"
version = "0.1.0"
description = "Distributed IoT system with MQTT broker, publisher, and consumer for Week 4 lab"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Diego Alejandro Botina", email = "alejandro.botina0125@jala.university" }
]
dependencies = [
    "aiomqtt>=2.3.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "typer>=0.15.0",
]

[project.scripts]
iot-publisher = "iot_system.presentation.cli:run_publisher"
iot-consumer = "iot_system.presentation.cli:run_consumer"
iot-demo-publisher = "iot_system.presentation.cli:run_demo_publisher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_system"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/iot_system --cov-report=term-missing --cov-fail-under=60 -m 'not integration'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running MQTT broker (deselect with '-m \"not integration\"')",
]
